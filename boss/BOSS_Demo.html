function Card({ children, style }) {
  return (
    <div style={{ background: CARD, border: `1px solid ${BDR}`, borderRadius: 8, padding: "18px 22px", ...style }}>
      {children}
    </div>
  );
}

function SL({ children, style }) {
  return (
    <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.14em", textTransform: "uppercase", color: LT, marginBottom: 12, ...style }}>
      {children}
    </div>
  );
}

function Dot({ status }) {
  const c = status === "green" ? GRN : status === "amber" ? AMB : RED;
  return <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: c, marginRight: 6, flexShrink: 0 }} />;
}

function Badge({ label, color }) {
  const colors = {
    blue:  [BLUL, BLU],
    green: [GRNL, GRN],
    amber: [AMBL, AMB],
    red:   [REDL, RED],
    gray:  [RUL,  LT],
  };
  const [bg, fg] = colors[color] || colors.blue;
  return (
    <span style={{ background: bg, color: fg, fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", padding: "2px 8px", borderRadius: 4, textTransform: "uppercase" }}>
      {label}
    </span>
  );
}

function Th({ children }) {
  return <th style={{ fontSize: 10, fontWeight: 700, color: LT, textAlign: "left", padding: "0 10px 8px 0", letterSpacing: "0.06em", textTransform: "uppercase", whiteSpace: "nowrap" }}>{children}</th>;
}

function Td({ children, bold, color, style }) {
  return <td style={{ fontSize: 12, fontWeight: bold ? 700 : 400, color: color || (bold ? INK : MID), padding: "8px 10px 8px 0", whiteSpace: "nowrap", ...style }}>{children}</td>;
}

function DraftBadge() {

function CommentBox({ children, color }) {

}

function NimSparkline({ data }) {
  const max = 3.80, min = 3.25, range = max - min;
  const w = 480, h = 100, pad = 20;
  const pts = data.map((d, i) => {
    const x = pad + (i / (data.length - 1)) * (w - 2 * pad);
    const y = h - pad - ((d.nim - min) / range) * (h - 2 * pad);
    return `${x},${y}`;
  });
  const floorY = h - pad - ((3.25 - min) / range) * (h - 2 * pad);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 100 }}>
      <line x1={pad} y1={floorY} x2={w - pad} y2={floorY} stroke={RED} strokeWidth={1} strokeDasharray="6 3" />
      <text x={w - pad + 4} y={floorY + 4} fontSize={9} fill={RED}>Floor</text>
      <polyline points={pts.join(" ")} fill="none" stroke={BLU} strokeWidth={2.5} strokeLinejoin="round" />
      {data.map((d, i) => {
        const x = pad + (i / (data.length - 1)) * (w - 2 * pad);
        const y = h - pad - ((d.nim - min) / range) * (h - 2 * pad);
        return (
          <g key={i}>
            <circle cx={x} cy={y} r={4} fill={BLU} />
            <text x={x} y={y - 8} fontSize={9} fill={LT} textAnchor="middle">{d.mo}</text>
            <text x={x} y={y + 18} fontSize={9} fill={MID} textAnchor="middle">{d.nim.toFixed(2)}</text>
          </g>
        );
      })}
    </svg>
  );
}

function CdBar({ data }) {
  const maxV = Math.max(...data.map(d => d.v));
  return (
    <div style={{ display: "flex", gap: 8, alignItems: "flex-end", height: 120, padding: "8px 0" }}>
      {data.map((d, i) => (
        <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
          <div style={{ fontSize: 9, color: MID, fontWeight: 600 }}>${d.v}M</div>
          <div style={{ width: "100%", background: BLU, borderRadius: "3px 3px 0 0", height: `${(d.v / maxV) * 80}px`, opacity: 0.8 + (i * 0.03) }} />
          <div style={{ fontSize: 9, color: LT, textAlign: "center", lineHeight: 1.2 }}>{d.b}</div>
        </div>
      ))}
    </div>
  );
}

      {/* Sidebar */}
      <div style={{ width: 218, background: SIDE, display: "flex", flexDirection: "column", flexShrink: 0, overflowY: "auto" }}>
        <div style={{ padding: "20px 20px 16px", borderBottom: "1px solid rgba(255,255,255,0.07)" }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 1, marginBottom: 3 }}>
            <span style={{ fontSize: 11, color: "#94A3B8", letterSpacing: 1 }}>catalyst</span>
            <span style={{ fontSize: 11, color: BLU }}>·</span>
            <span style={{ fontSize: 11, fontWeight: 700, color: "#F8FAFC", letterSpacing: 1 }}>dna</span>
          </div>
          <div style={{ fontSize: 20, fontWeight: 800, color: "#F8FAFC", letterSpacing: 3 }}>BOSS</div>
          <div style={{ fontSize: 8, color: "#475569", letterSpacing: 2, textTransform: "uppercase", marginTop: 1 }}>Bank Ops & Strategy System</div>
        </div>
        <div style={{ padding: "10px 20px", borderBottom: "1px solid rgba(255,255,255,0.07)" }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#F1F5F9" }}>{BANK.name}</div>
          <div style={{ fontSize: 10, color: "#475569", marginTop: 2 }}>{BANK.assets} · {BANK.hq}</div>
        </div>
        <nav style={{ flex: 1, padding: "8px 0" }}>
          {NAV.map((n) => (
            <button key={n.id} onClick={() => setScreen(n.id)} style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", padding: "9px 20px", background: screen === n.id ? "rgba(59,130,246,0.15)" : "transparent", borderLeft: `3px solid ${screen === n.id ? BLU : "transparent"}`, borderRight: "none", borderTop: "none", borderBottom: "none", color: screen === n.id ? "#F8FAFC" : "#94A3B8", fontSize: 13, fontWeight: screen === n.id ? 600 : 400, cursor: "pointer", textAlign: "left" }}>
              <span style={{ color: screen === n.id ? BLU : "#475569" }}>{n.icon}</span>
              {n.label}
            </button>
          ))}
        </nav>
        <div style={{ padding: "12px 20px", borderTop: "1px solid rgba(255,255,255,0.07)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 3 }}>
            <div style={{ width: 6, height: 6, borderRadius: "50%", background: GRN }} />
            <span style={{ fontSize: 10, color: "#94A3B8" }}>All systems operational</span>
          </div>
          <div style={{ fontSize: 10, color: "#475569" }}>M365 · Integrated</div>
        </div>
      </div>

      {/* Main */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        {/* Top bar */}
        <div style={{ background: CARD, borderBottom: `1px solid ${BDR}`, padding: "9px 22px", display: "flex", justifyContent: "space-between", alignItems: "center", flexShrink: 0 }}>
          <div style={{ fontSize: 12, color: LT }}>
            {screen === "alco" ? `ALCO Pre-Read · ${alcoTab}` : NAV.find((n) => n.id === screen)?.label}
          </div>
          {screen === "alco" && (
            <button onClick={() => setApproved(!approved)} style={{ background: approved ? GRN : BLUD, color: "#fff", border: "none", borderRadius: 6, padding: "6px 16px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
              {approved ? "CFO Approved & Published" : "CFO Approve & Publish"}
            </button>
          )}
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <span style={{ fontSize: 11, color: LT }}>Sarah Chen, CFO</span>
            <div style={{ width: 27, height: 27, borderRadius: "50%", background: BLUL, border: `2px solid ${BLU}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700, color: BLU }}>SC</div>
          </div>
        </div>

        {/* ALCO tab bar */}
        {screen === "alco" && (
          <div style={{ background: CARD, borderBottom: `1px solid ${BDR}`, display: "flex", overflowX: "auto", flexShrink: 0, padding: "0 16px" }}>
            {ALCO_TABS.map((tab) => (
              <button key={tab} onClick={() => setAlcoTab(tab)} style={{ padding: "9px 12px", background: "transparent", border: "none", borderBottom: `2px solid ${alcoTab === tab ? BLU : "transparent"}`, color: alcoTab === tab ? BLU : LT, fontSize: 11, fontWeight: alcoTab === tab ? 700 : 400, cursor: "pointer", whiteSpace: "nowrap" }}>
                {tab}
              </button>
            ))}
          </div>
        )}

        {/* Content */}
        <div style={{ flex: 1, overflowY: "auto", padding: 22 }}>
          <div style={{ maxWidth: 1080 }}>
            {screen === "pulse"     && <CEOPulse />}
            {screen === "alco"      && <AlcoScreen tab={alcoTab} approved={approved} />}
            {screen === "decisions" && <DecisionLog />}
            {screen === "bulletin"  && <Bulletin />}
          </div>
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(BOSSDemo));
</script>
</body>
</html>
